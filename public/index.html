<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antigravity × Codex · 协作工作台</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <svg class="svg-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="gemini-mascot" viewBox="0 0 72 72">
      <circle cx="36" cy="37" r="32" fill="#EAE2FF"/>
      <path d="M16 36 15 21q0-4 4-3l13 7h8l13-7q4-1 4 3l-1 15q5 6 5 11c0 10-10 15-25 15S11 57 11 47q0-6 5-11Z" fill="#FFF9FF" stroke="#8265AA" stroke-width="2" stroke-linejoin="round"/>
      <path d="m19 24 8 5-7 5Zm34 0-8 5 7 5Z" fill="#F4B7D8"/>
      <path d="m36 6 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="#FFE08B" stroke="#A17B30" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="27" cy="43" r="2.2" fill="#514164"/><circle cx="45" cy="43" r="2.2" fill="#514164"/>
      <path d="M31 49q2 3 5 0 3 3 5 0" fill="none" stroke="#8265AA" stroke-width="1.6" stroke-linecap="round"/>
      <ellipse cx="22" cy="49" rx="4" ry="2.4" fill="#FFD5E6"/><ellipse cx="50" cy="49" rx="4" ry="2.4" fill="#FFD5E6"/>
      <path d="M60 12v8m-4-4h8M9 25v6m-3-3h6" stroke="#A888CA" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="codex-mascot" viewBox="0 0 72 72">
      <circle cx="36" cy="37" r="32" fill="#D7F5E6"/>
      <path d="M19 32q-11-2-12 12 0 10 9 10l8-10m29-12q11-2 12 12 0 10-9 10l-8-10" fill="#E7A67F" stroke="#906753" stroke-width="2"/>
      <path d="M15 46c0-13 8-21 21-21s21 8 21 21c0 11-10 17-21 17s-21-6-21-17Z" fill="#FFF6E9" stroke="#906753" stroke-width="2"/>
      <path d="M18 34c0-12 7-22 18-22s18 10 18 22" fill="#FFE08B" stroke="#9D7138" stroke-width="2"/>
      <path d="M31 28V15a5 5 0 0 1 10 0v13" fill="#FFEAA9" stroke="#9D7138" stroke-width="1.7"/>
      <rect x="15" y="29" width="42" height="8" rx="4" fill="#FFD373" stroke="#9D7138" stroke-width="1.8"/>
      <circle cx="27" cy="45" r="2.2" fill="#55483E"/><circle cx="45" cy="45" r="2.2" fill="#55483E"/>
      <path d="M33 48q3-2 6 0-1 3-3 3t-3-3Z" fill="#906753"/><path d="M32 54q4 4 8 0" fill="none" stroke="#906753" stroke-width="1.5" stroke-linecap="round"/>
      <ellipse cx="22" cy="51" rx="4" ry="2.3" fill="#FFD5CE"/><ellipse cx="50" cy="51" rx="4" ry="2.3" fill="#FFD5CE"/>
    </symbol>
  </svg>

  <header class="topbar" data-modal-background>
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg><use href="#gemini-mascot"/></svg><svg><use href="#codex-mascot"/></svg>
        </div>
        <h1>Antigravity × Codex <span>· 协作工作台</span></h1>
      </div>
      <span id="connection" class="connection" role="status" data-state="pending">正在连接</span>
    </div>
  </header>

  <main class="studio" data-modal-background>
    <section id="quota-panel" aria-label="模型用量与额度">
      <article class="quota-card">
        <header class="quota-heading">
          <svg class="avatar" aria-hidden="true"><use href="#codex-mascot"/></svg>
          <h2>OpenAI Codex 额度</h2>
          <span id="codex-plan" class="pill plan-pill" hidden></span>
        </header>
        <div id="codex-windows" class="quota-windows"></div>
      </article>
      <article class="quota-card">
        <header class="quota-heading">
          <svg class="avatar" aria-hidden="true"><use href="#gemini-mascot"/></svg>
          <h2>Google Gemini 用量</h2>
          <label class="budget-label" for="token-budget">每日预算</label>
          <select id="token-budget" aria-label="Gemini 每日 Token 预算">
            <option value="20000000">20M</option>
            <option value="50000000" selected>50M</option>
            <option value="100000000">100M</option>
          </select>
        </header>
        <div id="gemini-usage" aria-live="polite"></div>
        <div id="gemini-metrics" class="quota-metrics"></div>
        <div id="gemini-models" class="meta-pills"></div>
      </article>
    </section>

    <div class="workspace">
      <aside class="sidebar" aria-labelledby="sessions-heading">
        <div class="sidebar-heading">
          <h2 id="sessions-heading">任务列表</h2>
          <span id="session-count" class="pill">0</span>
        </div>
        <div class="filters">
          <label class="sr-only" for="search">搜索会话</label>
          <input type="search" id="search" placeholder="搜索会话…">
          <label class="check"><input type="checkbox" id="subthreads"> 显示自动审查子线程</label>
        </div>
        <nav id="sessions" aria-label="任务列表" class="session-list"></nav>
      </aside>

      <section class="workflow" aria-labelledby="workflow-heading">
        <header class="workflow-heading">
          <h2 id="workflow-heading">协作工作流</h2>
          <div id="metadata" class="meta-pills" aria-label="当前会话概况" hidden>
            <span id="project" class="pill project-pill"></span>
            <span id="turn-count" class="pill"></span>
            <span id="token-count" class="pill"></span>
          </div>
        </header>
        <p id="request-status" class="request-status" role="status" hidden></p>
        <div id="workflow-stream" role="region" aria-labelledby="workflow-heading" tabindex="0">
          <p class="empty">正在加载会话…</p>
        </div>
      </section>
    </div>
  </main>

  <div id="detail-backdrop" hidden>
    <section id="detail-window" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-describedby="detail-turn">
      <header class="detail-header">
        <div class="detail-summary">
          <div id="detail-heading"></div>
          <div id="detail-badges"></div>
        </div>
        <button id="detail-close" type="button" title="关闭详情窗口" aria-label="关闭详情窗口">×</button>
      </header>
      <div id="detail-body" role="region" aria-label="详情内容" tabindex="0"></div>
    </section>
  </div>
</body>
</html>
